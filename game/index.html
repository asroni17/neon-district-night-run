<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon District</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #title-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a12; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #00ffaa; font-family: 'Courier New', monospace; }
    #title-screen h1 { font-size: 4rem; text-shadow: 0 0 20px #00ffaa, 0 0 40px #006644; margin-bottom: 1rem; letter-spacing: 0.2em; }
    #title-screen .subtitle { font-size: 1.2rem; color: #88ccaa; margin-bottom: 3rem; text-shadow: 0 0 10px #00ffaa; }
    #title-screen .menu { display: flex; flex-direction: column; gap: 1rem; }
    #title-screen button { background: transparent; border: 2px solid #00ffaa; color: #00ffaa; padding: 1rem 3rem; font-size: 1.2rem; font-family: inherit; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.1em; }
    #title-screen button:hover { background: #00ffaa; color: #0a0a12; box-shadow: 0 0 30px #00ffaa; }
    #title-screen button:disabled { border-color: #335544; color: #335544; cursor: not-allowed; }
    #hud { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 20; }
    #hud-left { display: flex; flex-direction: column; gap: 0.5rem; }
    #hud-right { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }
    .hud-panel { background: rgba(10, 10, 18, 0.85); border: 1px solid #00ffaa; border-radius: 8px; padding: 0.75rem 1rem; backdrop-filter: blur(10px); min-width: 180px; }
    .hud-panel h3 { color: #00ffaa; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; border-bottom: 1px solid #003322; padding-bottom: 0.25rem; }
    .stat-row { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; }
    .stat-label { color: #66aa88; }
    .stat-value { color: #00ffaa; font-weight: bold; font-variant-numeric: tabular-nums; }
    .wanted-stars { display: flex; gap: 2px; }
    .star { width: 20px; height: 20px; background: #332200; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); transition: background 0.2s; }
    .star.active { background: #ffdd00; box-shadow: 0 0 10px #ffdd00; }
    #minimap { position: absolute; bottom: 20px; right: 20px; width: 200px; height: 200px; border: 2px solid #00ffaa; border-radius: 8px; background: #05050a; box-shadow: 0 0 20px rgba(0, 255, 170, 0.3), inset 0 0 20px rgba(0, 255, 170, 0.1); }
    #minimap canvas { width: 100%; height: 100%; display: block; }
    #mission-panel { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 18, 0.95); border: 2px solid #ff6600; border-radius: 8px; padding: 1rem 2rem; z-index: 30; display: none; box-shadow: 0 0 30px rgba(255, 102, 0, 0.4); }
    #mission-panel.active { display: block; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 30px rgba(255, 102, 0, 0.4); } 50% { box-shadow: 0 0 50px rgba(255, 102, 0, 0.8); } }
    #mission-panel h3 { color: #ff6600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    #mission-panel p { color: #ffaa88; font-size: 0.9rem; line-height: 1.5; }
    #notification { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 18, 0.95); border: 2px solid #00ffaa; border-radius: 8px; padding: 0.75rem 1.5rem; z-index: 40; display: none; color: #00ffaa; font-size: 0.9rem; box-shadow: 0 0 20px rgba(0, 255, 170, 0.4); }
    #notification.active { display: block; animation: slideDown 0.3s ease-out; }
    @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    #pause-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 18, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; z-index: 200; color: #00ffaa; }
    #pause-menu.active { display: flex; }
    #pause-menu h2 { font-size: 2rem; text-shadow: 0 0 20px #00ffaa; }
    #pause-menu button { background: transparent; border: 2px solid #00ffaa; color: #00ffaa; padding: 1rem 3rem; font-size: 1.1rem; font-family: inherit; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.1em; min-width: 200px; }
    #pause-menu button:hover { background: #00ffaa; color: #0a0a12; }
    #save-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 18, 0.98); border: 2px solid #00ffaa; border-radius: 8px; padding: 2rem; z-index: 210; display: none; width: 400px; max-height: 80vh; overflow-y: auto; color: #00ffaa; }
    #save-menu.active { display: block; }
    #save-menu h3 { text-align: center; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .save-slot { background: rgba(0, 255, 170, 0.05); border: 1px solid #003322; border-radius: 4px; padding: 1rem; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; }
    .save-slot:hover { border-color: #00ffaa; background: rgba(0, 255, 170, 0.1); }
    .save-slot.empty { color: #335544; }
    .save-slot-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .save-slot-info { font-size: 0.8rem; color: #66aa88; }
    #save-menu button.close-btn { width: 100%; margin-top: 1rem; }
    #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 18, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; z-index: 200; color: #ff3333; text-align: center; }
    #game-over.active { display: flex; }
    #game-over h2 { font-size: 3rem; text-shadow: 0 0 30px #ff3333; }
    #game-over .final-stats { color: #00ffaa; font-size: 1.1rem; line-height: 2; }
    #game-over button { background: transparent; border: 2px solid #ff3333; color: #ff3333; padding: 1rem 3rem; font-size: 1.2rem; font-family: inherit; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.1em; }
    #game-over button:hover { background: #ff3333; color: #0a0a12; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui">
    <div id="title-screen">
      <h1>NEON DISTRICT</h1>
      <div class="subtitle">An Original Offline Open-World Crime Game</div>
      <div class="menu">
        <button id="btn-new-game">New Game</button>
        <button id="btn-continue" disabled>Continue</button>
        <button id="btn-settings">Settings</button>
      </div>
    </div>
    <div id="hud">
      <div id="hud-left">
        <div class="hud-panel" id="health-panel">
          <h3>Health</h3>
          <div class="stat-row"><span class="stat-label">HP</span><span class="stat-value" id="hp-value">100/100</span></div>
          <div class="stat-row"><span class="stat-label">Armor</span><span class="stat-value" id="armor-value">0/100</span></div>
        </div>
        <div class="hud-panel" id="wanted-panel">
          <h3>Wanted Level</h3>
          <div class="wanted-stars" id="wanted-stars">
            <div class="star" data-level="1"></div>
            <div class="star" data-level="2"></div>
            <div class="star" data-level="3"></div>
            <div class="star" data-level="4"></div>
            <div class="star" data-level="5"></div>
          </div>
        </div>
        <div class="hud-panel" id="vehicle-panel" style="display: none;">
          <h3>Vehicle</h3>
          <div class="stat-row"><span class="stat-label">Health</span><span class="stat-value" id="veh-health">100%</span></div>
          <div class="stat-row"><span class="stat-label">Speed</span><span class="stat-value" id="veh-speed">0 km/h</span></div>
        </div>
      </div>
      <div id="hud-right">
        <div class="hud-panel" id="money-panel">
          <h3>Cash</h3>
          <div class="stat-row"><span class="stat-value" id="money-value">$0</span></div>
        </div>
        <div class="hud-panel" id="weapon-panel">
          <h3>Weapon</h3>
          <div class="stat-row"><span class="stat-value" id="weapon-name">Fists</span></div>
          <div class="stat-row"><span class="stat-label">Ammo</span><span class="stat-value" id="ammo-count">-</span></div>
        </div>
      </div>
    </div>
    <div id="minimap"><canvas id="minimap-canvas"></canvas></div>
    <div id="mission-panel"><h3>Mission</h3><p id="mission-text"></p></div>
    <div id="notification"></div>
    <div id="pause-menu">
      <h2>PAUSED</h2>
      <button id="btn-resume">Resume</button>
      <button id="btn-save">Save Game</button>
      <button id="btn-load">Load Game</button>
      <button id="btn-settings-pause">Settings</button>
      <button id="btn-quit">Quit to Title</button>
    </div>
    <div id="save-menu">
      <h3>Save / Load Game</h3>
      <div id="save-slots"></div>
      <button class="close-btn" id="btn-close-save">Close</button>
    </div>
    <div id="game-over">
      <h2>WASTED</h2>
      <div class="final-stats" id="final-stats"></div>
      <button id="btn-retry">Retry</button>
      <button id="btn-title">Title Screen</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
